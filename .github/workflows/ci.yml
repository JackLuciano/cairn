name: CI

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  check:
    name: Clippy and tests (Windows)
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-ci'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2

      - name: Git identity for tests
        run: |
          git config --global user.name "Cairn CI"
          git config --global user.email "ci@cairn.invalid"

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace
