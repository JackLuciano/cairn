name: Build (macOS and Linux)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: unix-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            artifact: cairn-linux-x64
          - name: macOS Apple Silicon
            os: macos-15
            artifact: cairn-macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            artifact: cairn-macos-x64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang cmake libssl-dev libzstd-dev \
            libfontconfig-dev libfreetype-dev libasound2-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libdbus-1-dev

      - name: Git identity for tests
        run: |
          git config --global user.name "Cairn CI"
          git config --global user.email "ci@cairn.invalid"

      - name: Core tests
        run: cargo test -p cairn-core

      - name: Build
        run: cargo build --release -p cairn

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/cairn dist/
          cp README.md CHANGELOG.md dist/ 2>/dev/null || true
          tar -czf ${{ matrix.artifact }}.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  publish:
    name: Attach to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Wait for the Windows release
        run: |
          for i in $(seq 1 60); do
            if gh release view "$TAG" > /dev/null 2>&1; then exit 0; fi
            sleep 30
          done
          echo "The release $TAG does not exist yet" >&2
          exit 1

      - name: Upload the archives
        run: |
          version="${TAG#v}"
          for dir in dist/*/; do
            name="$(basename "$dir")"
            cp "$dir/$name.tar.gz" "${name/cairn-/cairn-$version-}.tar.gz"
          done
          gh release upload "$TAG" cairn-"$version"-*.tar.gz --clobber

      - name: Add the experimental note
        run: |
          version="${TAG#v}"
          gh release view "$TAG" --json body --jq .body > notes.md
          if ! grep -q "macOS and Linux (experimental)" notes.md; then
            cat >> notes.md <<EOF

          ### macOS and Linux (experimental)

          \`cairn-$version-macos-arm64.tar.gz\` (Apple Silicon), \`cairn-$version-macos-x64.tar.gz\` (Intel) and
          \`cairn-$version-linux-x64.tar.gz\` are built and tested automatically but have not been tried by hand
          yet. They are plain binaries without automatic updates. On macOS the app is not signed: after
          unpacking, run \`xattr -d com.apple.quarantine cairn\` once, then \`./cairn\`. Git 2.40 or newer must
          be installed. Please report anything that breaks.
          EOF
            gh release edit "$TAG" --notes-file notes.md
          fi
