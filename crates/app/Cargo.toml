[package]
name = "cairn"
description = "A fast, friendly desktop git client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "cairn"
path = "src/main.rs"

[dependencies]
cairn-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
dirs.workspace = true
gpui-kit.workspace = true
rust-i18n.workspace = true
smol.workspace = true
uuid.workspace = true
keyring = "4.2"
notify = "8.2"
velopack = "=1.3.39-g8d2844f"
ureq = { version = "3.5", features = ["json"] }
sha2 = "0.10"
regex = "1"
tempfile.workspace = true

[dev-dependencies]
serde-saphyr = "1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
